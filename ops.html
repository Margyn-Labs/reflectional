<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Margyn Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --canvas:#FAFAF8; --surf:#fff; --border:#E4E1DA;
    --ink-0:#14181F; --ink-1:#5B6472; --ink-2:#8B93A0;
    --emerald:#0E8F5C; --blue:#0B4B8C; --orange:#CC5B34; --rust:#B3432E;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--canvas); color:var(--ink-0);
    font-family:'Manrope',system-ui,sans-serif; font-size:14px; line-height:1.5; }
  code,.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  header{ padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:12px; background:var(--surf); }
  header h1{ font-size:16px; font-weight:800; margin:0; letter-spacing:-.01em; }
  header .sub{ color:var(--ink-2); font-size:12px; }
  header .spacer{ flex:1; }
  header button{ font:inherit; font-size:12px; border:1px solid var(--border); background:var(--surf); color:var(--ink-1); border-radius:7px; padding:5px 11px; cursor:pointer; }
  header button:hover{ color:var(--ink-0); }
  main{ padding:24px; max-width:1400px; }
  .gate{ padding:64px 24px; text-align:center; color:var(--ink-1); }
  .gate code{ display:block; margin-top:12px; color:var(--ink-2); font-size:12px; }

  table{ width:100%; border-collapse:collapse; background:var(--surf); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); font-weight:700; cursor:pointer; user-select:none; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#F4F2EE; }

  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:capitalize; }
  .chip::before{ content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .chip.green{ color:var(--emerald); background:rgba(14,143,92,.10); }
  .chip.yellow{ color:var(--orange); background:rgba(204,91,52,.10); }
  .chip.red{ color:var(--rust); background:rgba(179,67,46,.10); }
  .chip.grey{ color:var(--ink-2); background:#F4F2EE; }
  .wlog{ margin-bottom:22px; }
  .wlog h2{ font-size:14px; margin:0 0 8px; display:flex; align-items:center; gap:10px; }
  .wlog h2 button{ font:inherit; font-size:11.5px; font-weight:600; border:1px solid var(--border); background:var(--surf); color:var(--ink-1); border-radius:6px; padding:3px 9px; cursor:pointer; }
  .wlog h2 button.on{ color:var(--ink-0); border-color:var(--ink-1); }
  .wlog th{ cursor:default; }
  .wlog td .t{ display:block; font-size:11px; color:var(--ink-2); margin-top:2px; }

  .conn{ display:inline-block; font-size:11px; padding:1px 7px; border:1px solid var(--border); border-radius:6px; margin:1px 3px 1px 0; }
  .conn.reauth{ color:var(--rust); border-color:var(--rust); }
  .num{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .muted{ color:var(--ink-2); }

  /* detail */
  .overlay{ position:fixed; inset:0; background:rgba(20,24,31,.35); display:flex; justify-content:flex-end; z-index:50; }
  .drawer{ width:min(760px,96vw); background:var(--canvas); height:100%; overflow-y:auto; border-left:1px solid var(--border); }
  .drawer .dhead{ padding:18px 22px; border-bottom:1px solid var(--border); background:var(--surf); position:sticky; top:0; }
  .drawer .dhead h2{ margin:0 0 2px; font-size:15px; font-weight:800; }
  .drawer .dhead .x{ position:absolute; top:16px; right:18px; border:none; background:none; font-size:20px; cursor:pointer; color:var(--ink-2); }
  .tabs{ display:flex; gap:2px; padding:0 22px; border-bottom:1px solid var(--border); background:var(--surf); }
  .tabs button{ font:inherit; font-size:12.5px; font-weight:700; border:none; background:none; padding:10px 12px; cursor:pointer; color:var(--ink-2); border-bottom:2px solid transparent; }
  .tabs button.active{ color:var(--ink-0); border-bottom-color:var(--emerald); }
  .tabpane{ padding:20px 22px; }
  .tabpane h3{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); margin:0 0 8px; }
  .kv{ display:grid; grid-template-columns:180px 1fr; gap:4px 14px; font-size:13px; margin-bottom:18px; }
  .kv div:nth-child(odd){ color:var(--ink-1); }
  .evrow{ display:grid; grid-template-columns:190px 200px 1fr; gap:10px; font-size:12px; padding:4px 0; border-bottom:1px dashed var(--border); }
  textarea{ width:100%; min-height:90px; font:inherit; font-size:13px; border:1px solid var(--border); border-radius:8px; padding:9px; resize:vertical; background:var(--surf); }
  .noteform label{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-1); margin:10px 0 3px; }
  .noteform input{ width:100%; font:inherit; font-size:13px; border:1px solid var(--border); border-radius:7px; padding:7px 9px; background:var(--surf); }
  .noteform .count{ float:right; font-weight:400; color:var(--ink-2); }
  .notepreview{ white-space:pre-wrap; font-size:12.5px; background:#E7F6EE; border:1px solid rgba(14,143,92,.25); border-radius:8px; padding:10px 12px; margin-top:12px; }
  .ghostbtn{ margin-top:8px; font:inherit; font-size:12.5px; font-weight:700; background:var(--surf); color:var(--ink-0); border:1px solid var(--border); border-radius:7px; padding:7px 14px; cursor:pointer; }
  .savebtn{ margin-top:8px; font:inherit; font-size:12.5px; font-weight:700; background:var(--emerald); color:#fff; border:none; border-radius:7px; padding:7px 14px; cursor:pointer; }
  .pill{ display:inline-block; font-size:11px; background:#F4F2EE; border:1px solid var(--border); border-radius:6px; padding:1px 7px; margin:2px; }
  .suggest{ background:rgba(204,91,52,.08); border:1px solid rgba(204,91,52,.25); color:#8a3f24; border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:16px; }
  .loading{ padding:40px; color:var(--ink-2); }
  .banner{ font-size:12.5px; color:var(--ink-1); background:var(--surf); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:14px; }
  header nav{ display:flex; gap:4px; margin-left:8px; }
  header nav button.on{ color:var(--ink-0); border-color:var(--ink-1); }
  .funnel{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .funnel .st{ background:var(--surf); border:1px solid var(--border); border-radius:8px; padding:8px 12px; min-width:120px; }
  .funnel .st b{ display:block; font-size:18px; font-family:'IBM Plex Mono',monospace; }
  .funnel .st span{ font-size:11px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; }
  .step{ font-size:11.5px; white-space:nowrap; }
  .step.done{ color:var(--emerald); font-weight:700; }
  .step.stuck{ color:var(--orange); font-weight:700; }
  .invform{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; font-size:12.5px; }
  .invform input{ font:inherit; font-size:12.5px; border:1px solid var(--border); border-radius:7px; padding:6px 9px; background:var(--surf); min-width:200px; }
  /* team logins (2026-11-21) */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:8px; margin-bottom:18px; }
  .kpi{ background:var(--surf); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .kpi span{ display:block; font-size:11px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.04em; }
  .kpi b{ display:block; font-size:20px; font-family:'IBM Plex Mono',monospace; font-weight:500; margin-top:2px; }
  .kpi small{ display:block; font-size:11.5px; color:var(--ink-1); margin-top:1px; }
  .kpi.bad b{ color:var(--rust); }
  .sec{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); margin:22px 0 8px; font-weight:700; }
  .fun{ background:var(--surf); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .fun .row{ display:grid; grid-template-columns:200px 1fr 60px 150px; gap:12px; align-items:center; font-size:12.5px; padding:4px 0; }
  .fun .bar{ height:14px; background:#F4F2EE; border-radius:4px; overflow:hidden; }
  .fun .bar i{ display:block; height:100%; background:var(--emerald); border-radius:4px; }
  .dots{ display:flex; gap:3px; }
  .dots i{ width:10px; height:10px; border-radius:50%; background:#E4E1DA; display:block; }
  .dots i.on{ background:var(--emerald); }
  .dots i.stuck{ background:var(--orange); }
  .strip{ display:flex; gap:2px; align-items:flex-end; height:44px; margin:6px 0 14px; }
  .strip i{ flex:1; background:#E4E1DA; border-radius:2px; min-height:3px; display:block; }
  .strip i.on{ background:var(--emerald); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .stg{ display:grid; grid-template-columns:22px 1fr 150px 120px; gap:8px; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--border); align-items:center; }
  .stg .ic{ font-weight:800; }
  .stg .ic.on{ color:var(--emerald); } .stg .ic.stuck{ color:var(--orange); } .stg .ic.off{ color:var(--ink-2); }
  @media (max-width:900px){ .two{ grid-template-columns:1fr; } .fun .row{ grid-template-columns:120px 1fr 44px; } .fun .row .muted{ display:none; } }
  @media (max-width:720px){ main{ padding:16px; } table{ display:block; overflow-x:auto; } }
</style>
</head>
<body>
<header>
  <h1>Margyn Ops</h1>
  <span class="sub">design-partner health &middot; usage &middot; value</span>
  <nav><button id="tabPartners" class="on">Partners</button><button id="tabInvestors">Investors</button><button id="tabTeam">Team logins</button></nav>
  <span class="spacer"></span>
  <span class="sub" id="genAt"></span>
  <button id="refreshBtn">Refresh</button>
</header>
<main id="main"><div class="loading">Loading…</div></main>

<script src="/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://lmegnxrixlrvyodqfthn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_TcTCDSECsRxbDVXAnI893w_3BJC0Kgh';
let view = 'partners', investors = null;
let sb = null, token = null, watchLog = null, watchDay = 'today', partners = [], metricsById = {}, metricsConfigured = null, sortKey = 'status', sortDir = 1;

const $ = (s, r=document) => r.querySelector(s);
const fmtDate = (t) => t ? new Date(t).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const ago = (t) => {
  if(!t) return '—';
  const h = (Date.now() - new Date(t)) / 3600000;
  if(h < 1) return Math.round(h*60)+'m';
  if(h < 48) return Math.round(h)+'h';
  return Math.round(h/24)+'d';
};

async function api(path, opts={}){
  const res = await fetch('/api/ops' + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token, ...(opts.headers||{}) }
  });
  if(res.status === 404) { const e = new Error('gate'); e.gate = true; throw e; }
  if(!res.ok) throw new Error('api ' + res.status);
  return res.json();
}

function gateScreen(){
  $('#main').innerHTML = '<div class="gate">This surface is founder-only.<br>Sign in on the same browser session as a Margyn account in <span class="mono">OPS_ADMIN_USER_IDS</span>.'
    + '<code>If you are the founder and seeing this: check OPS_ADMIN_USER_IDS / OPS_ADMIN_SECRET in Vercel env.</code></div>';
}

const RANK = { red:0, yellow:1, green:2 };
function sortRows(){
  partners.sort((a,b) => {
    let av, bv;
    if(sortKey === 'status'){ av = RANK[a.status]; bv = RANK[b.status]; }
    else if(sortKey === 'value'){ av = RANK[a.value_pulse]; bv = RANK[b.value_pulse]; }
    else if(sortKey === 'active'){ av = new Date(a.last_active_at||0); bv = new Date(b.last_active_at||0); }
    else if(sortKey === 'mismatch'){ av = a.recon_open_mismatches; bv = b.recon_open_mismatches; }
    else if(sortKey === 'wa'){ av = a.whatsapp_in_7d + a.whatsapp_out_7d; bv = b.whatsapp_in_7d + b.whatsapp_out_7d; }
    else if(sortKey === 'verified'){ av = covOf(a.user_id); bv = covOf(b.user_id); }
    else { av = (a.label||'').toLowerCase(); bv = (b.label||'').toLowerCase(); }
    return (av < bv ? -1 : av > bv ? 1 : 0) * sortDir;
  });
}

// ops_metrics (read as ops_reader) — counts/percentages only, never amounts.
const covOf = (id) => { const m = metricsById[id]; return m && m.verified_coverage_pct != null ? Number(m.verified_coverage_pct) : -1; };
function trustCell(id){
  const m = metricsById[id];
  if(!m) return '<span class="muted">—</span>';
  const pct = m.verified_coverage_pct == null ? '—' : Math.round(Number(m.verified_coverage_pct)) + '%';
  return pct + (m.source_conflict_count ? ' <span class="muted">· ' + m.source_conflict_count + ' conflict' + (m.source_conflict_count === 1 ? '' : 's') + '</span>' : '');
}

function renderList(){
  sortRows();
  const rows = partners.map(p => {
    const conns = (p.connectors||[]).map(c =>
      '<span class="conn' + (c.needs_reauth ? ' reauth' : '') + '">' + c.name + (c.needs_reauth ? ' ⚠' : '') + '</span>'
    ).join('') || '<span class="muted">none</span>';
    return '<tr data-id="' + p.user_id + '">'
      + '<td><span class="chip ' + p.status + '">' + p.status + '</span></td>'
      + '<td>' + escapeHtml(p.label || p.user_id) + (p.company_name && p.company_name !== p.label ? '<br><span class="muted">' + escapeHtml(p.company_name) + '</span>' : '') + '</td>'
      + '<td class="num">' + ago(p.last_active_at) + '</td>'
      + '<td>' + conns + '</td>'
      + '<td class="num">' + p.recon_open_mismatches + '</td>'
      + '<td class="num">' + (p.whatsapp_in_7d + p.whatsapp_out_7d) + '</td>'
      + '<td class="num">' + trustCell(p.user_id) + '</td>'
      + '<td><span class="chip ' + p.value_pulse + '">' + p.value_pulse + '</span></td>'
      + '<td>' + escapeHtml(p.suggested_next || '') + '</td>'
      + '<td class="muted">' + escapeHtml(p.note_preview || '') + '</td>'
      + '</tr>';
  }).join('');
  const banner = metricsConfigured === false
    ? '<div class="banner">Verified coverage is off: set <span class="mono">OPS_METRICS_JWT</span> in Vercel and run the ops-metrics cron once.</div>'
    : '';
  $('#main').innerHTML = banner + watchLogHtml() +
    '<table><thead><tr>'
    + '<th data-k="status">Status</th><th data-k="label">Partner</th><th data-k="active">Active</th>'
    + '<th>Connectors</th><th data-k="mismatch">Mism.</th><th data-k="wa">WA 7d</th><th data-k="verified">Verified</th>'
    + '<th data-k="value">Value</th><th>Suggested next</th><th>Note</th>'
    + '</tr></thead><tbody>' + (rows || '<tr><td colspan="10" class="muted">No partners with activity yet.</td></tr>') + '</tbody></table>';
  $('#main').querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if(sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    renderList();
  });
  $('#main').querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
  $('#main').querySelectorAll('[data-wday]').forEach(b => b.onclick = async () => { watchDay = b.dataset.wday; await loadWatchLog(); renderList(); });
}

// Margyn's WhatsApp updates: one row per account, one cell per time slot. Statuses only, never the message.
const WSLOTS = [['morning', '7:30 am'], ['midday', '10:30'], ['noon', '12:30'], ['afternoon', '3:00 pm'], ['late', '5:00'], ['evening', '7:00 pm']];
function istDayOffset(n){ return new Date(Date.now() + 5.5 * 3600000 - n * 86400000).toISOString().slice(0, 10); }
async function loadWatchLog(){
  try { watchLog = await api('?action=watch-log&day=' + istDayOffset(watchDay === 'yesterday' ? 1 : 0)); }
  catch(e){ if(e.gate) throw e; watchLog = { error: true }; }
}
function watchCell(x){
  if(!x) return '<span class="muted">—</span>';
  const time = '<span class="t">' + new Date(x.at).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', timeZone:'Asia/Kolkata' }) + '</span>';
  let cls, label;
  if(x.outcome === 'sent'){
    const d = x.delivery;
    cls = d === 'read' || d === 'delivered' ? 'green' : d === 'failed' ? 'red' : 'yellow';
    label = d === 'read' ? 'Read' : d === 'delivered' ? 'Delivered' : d === 'failed' ? 'Failed' : d === 'untracked' ? 'Sent' : 'Sent, unconfirmed';
    if(x.to === 'preview') label += ' (test phone)';
  } else if(x.outcome === 'quiet'){ cls = 'grey'; label = 'Quiet'; }
  else if(x.outcome === 'off'){ cls = 'grey'; label = 'Off'; }
  else if(x.outcome === 'skipped'){ cls = 'grey'; label = 'No books'; }
  else { cls = 'red'; label = 'Couldn’t send'; }
  const why = [x.reason, x.delivery_error, x.via ? 'via ' + x.via : null, x.points ? x.points + ' point' + (x.points === 1 ? '' : 's') : null].filter(Boolean).join(' · ');
  return '<span class="chip ' + cls + '" title="' + escapeHtml(why) + '">' + escapeHtml(label) + '</span>' + time;
}
function watchLogHtml(){
  const head = '<h2>Margyn’s WhatsApp updates <button data-wday="today" class="' + (watchDay === 'today' ? 'on' : '') + '">Today</button><button data-wday="yesterday" class="' + (watchDay === 'yesterday' ? 'on' : '') + '">Yesterday</button></h2>';
  if(!watchLog) return '';
  if(watchLog.error) return '<div class="wlog">' + head + '<p class="muted">Could not load.</p></div>';
  const rows = (watchLog.accounts || []).map(a => '<tr><td>' + escapeHtml(a.label) + '</td>' + WSLOTS.map(([k]) => '<td>' + watchCell(a.slots[k]) + '</td>').join('') + '</tr>').join('');
  const note = watchLog.delivery_tracking ? 'Hover a status for the reason. Delivered and Read come from WhatsApp itself.'
    : 'WhatsApp delivery reports aren’t being stored yet (run 2026-10-04-whatsapp-delivery.sql), so a sent update shows as Sent, not Delivered or Read.';
  return '<div class="wlog">' + head + '<table><thead><tr><th>Account</th>' + WSLOTS.map(([, l]) => '<th>' + l + '</th>').join('') + '</tr></thead><tbody>'
    + (rows || '<tr><td colspan="7" class="muted">No updates have run yet ' + (watchDay === 'today' ? 'today' : 'yesterday') + '.</td></tr>') + '</tbody></table><p class="muted" style="font-size:12px;margin:6px 0 0">' + note + '</p></div>';
}

async function openDetail(userId){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="drawer"><div class="loading">Loading partner…</div></div>';
  ov.onclick = (e) => { if(e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  let d;
  try { d = await api('?action=partner&userId=' + encodeURIComponent(userId)); }
  catch(e){ $('.drawer', ov).innerHTML = '<div class="loading">Could not load.</div>'; return; }

  const s = d.suggested_next || {};
  const u7 = d.usage.by_name_7d, u30 = d.usage.by_name_30d;
  const evNames = Object.keys(u30);
  const usageRows = evNames.map(n =>
    '<div class="evrow"><div>' + n + '</div><div class="num">' + u7[n] + ' / 7d</div><div class="num muted">' + u30[n] + ' / 30d</div></div>'
  ).join('');
  const connRows = d.health.connectors.map(c =>
    '<div class="kv"><div>' + c.name + '</div><div>' + (c.needs_reauth ? '<b style="color:var(--rust)">needs reauth</b> &middot; ' : '')
    + 'last sync ' + fmtDate(c.last_success_at) + (c.days_since_last_sync != null ? ' (' + c.days_since_last_sync + 'd)' : '') + '</div></div>'
  ).join('') || '<p class="muted">No connectors.</p>';
  const errRows = (d.health.recent_track_errors||[]).map(e =>
    '<div class="evrow"><div>' + fmtDate(e.created_at) + '</div><div>' + (e.connector_type||'') + '</div><div class="muted">' + escapeHtml(e.error_message||e.operation||'') + '</div></div>'
  ).join('') || '<p class="muted">None.</p>';
  const timeline = (d.timeline||[]).map(e =>
    '<div class="evrow"><div>' + fmtDate(e.at) + '</div><div>' + e.name + '</div><div class="muted mono">' + escapeHtml(JSON.stringify(e.props||{})) + '</div></div>'
  ).join('') || '<p class="muted">No events.</p>';

  $('.drawer', ov).innerHTML =
    '<div class="dhead"><button class="x">&times;</button>'
    + '<h2>' + escapeHtml(d.label || d.user_id) + '</h2>'
    + '<div class="muted mono" style="font-size:11px">' + d.user_id + '</div></div>'
    + '<div class="tabs">'
    + '<button data-t="health" class="active">Health</button><button data-t="usage">Usage</button>'
    + '<button data-t="outcomes">Outcomes</button><button data-t="trust">Trust</button><button data-t="timeline">Timeline</button></div>'
    + '<div class="tabpane" data-p="health">'
      + '<div class="suggest"><b>Suggested next:</b> ' + escapeHtml(s.suggested_next || '') + ' &nbsp; <span class="pill">status ' + (s.status||'?') + '</span><span class="pill">value ' + (s.value_pulse||'?') + '</span></div>'

/* ---------- Investors: tenants + funnel (api/ops.js?action=investor-*) ----------
   Counts, timestamps, statuses and closed error codes only — the API never sends
   amounts, party names, GSTINs, free text, emails or phone numbers. */
const STEP_SHORT = { invite:'Invited', first_login:'Login', preview_watched:'Preview', connect_started:'Connect', org_picked:'Org', first_sync:'Sync' };
function stepCell(r, s){
  const at = r.steps[s];
  if(at) return '<span class="step done" title="' + escapeHtml(fmtDate(at)) + '">&#10003; ' + ago(at) + '</span>';
  if(r.stuck_at === s) return '<span class="step stuck">stuck here</span>';
  if((r.skipped || []).includes(s)) return '<span class="muted">skipped</span>';
  return '<span class="muted">—</span>';
}
function renderInvestors(){
  const d = investors;
  if(!d){ $('#main').innerHTML = '<div class="loading">Loading investors…</div>'; return; }
  if(d.error){ $('#main').innerHTML = '<div class="gate">Could not load investors.</div>'; return; }
  const steps = d.steps || [];
  const banner = d.tenants_table === false
    ? '<div class="banner">Investor invites aren’t stored yet: run <span class="mono">2026-10-29-ops-investor-funnel.sql</span>. Preview refs still show below, unlinked.</div>' : '';
  const funnel = '<div class="funnel">' + steps.map(s => '<div class="st"><span>' + escapeHtml(d.step_labels[s] || s) + '</span><b>' + (d.totals[s] || 0) + '</b></div>').join('') + '</div>';
  const form = '<div class="invform"><b>Register invite</b><input id="invRef" placeholder="preview ref, e.g. avijeet-shastra"><input id="invUid" placeholder="Margyn login id (optional, uuid)"><button class="savebtn" style="margin:0" id="invSave">Save</button><span class="muted" id="invMsg"></span></div>';
  const rows = (d.tenants || []).map(r => '<tr data-ref="' + escapeHtml(r.ref) + '">'
    + '<td class="mono">' + escapeHtml(r.ref) + (r.registered ? '' : ' <span class="muted">(preview only)</span>') + '</td>'
    + '<td>' + (r.linked ? '<span class="chip green">linked</span>' : '<span class="chip grey">no login</span>') + '</td>'
    + steps.map(s => '<td>' + stepCell(r, s) + '</td>').join('')
    + '<td class="muted">' + escapeHtml(r.preview && r.preview.furthest ? r.preview.furthest + ' · ' + r.preview.opens + ' open' + (r.preview.opens === 1 ? '' : 's') : '—') + '</td>'
    + '<td>' + (r.last_sync ? '<span class="chip ' + (r.last_sync.ok ? 'green' : 'red') + '">' + (r.last_sync.ok ? 'ok' : escapeHtml(r.last_sync.error_code || 'error')) + '</span>' + (r.last_sync.rows_synced != null ? ' <span class="num muted">' + r.last_sync.rows_synced + ' rows</span>' : '') : '<span class="muted">—</span>') + '</td>'
    + '<td class="num">' + ago(r.last_activity_at) + '</td></tr>').join('');
  $('#main').innerHTML = banner + funnel + form + '<table><thead><tr><th>Ref</th><th>Login</th>'
    + steps.map(s => '<th>' + escapeHtml(STEP_SHORT[s] || s) + '</th>').join('')
    + '<th>Preview</th><th>Last sync</th><th>Active</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="' + (steps.length + 5) + '" class="muted">No investor tenants or preview views yet.</td></tr>') + '</tbody></table>';
  $('#main').querySelectorAll('tr[data-ref]').forEach(tr => tr.onclick = () => openInvestor(tr.dataset.ref));
  $('#invSave').onclick = () => saveInvestor($('#invRef').value, $('#invUid').value, $('#invMsg'));
}
async function saveInvestor(ref, uid, msgEl){
  msgEl.textContent = 'Saving…';
  try {
    await api('?action=investor-tenant', { method:'PUT', body: JSON.stringify({ ref: ref.trim(), user_id: uid.trim() || null }) });
    msgEl.textContent = 'Saved';
    await loadInvestors(); renderInvestors();
  } catch(e){ msgEl.textContent = e.gate ? 'Not allowed' : 'Failed (check the ref and the login id)'; }
}
async function loadInvestors(){
  try { investors = await api('?action=investor-tenants'); }
  catch(e){ if(e.gate) throw e; investors = { error: true }; }
}

  const ov = document.createElement('div');

  const tl = (d.timeline || []).map(e => '<div class="evrow"><div>' + fmtDate(e.at) + '</div><div>' + escapeHtml(e.label) + ' <span class="muted">' + escapeHtml(e.kind) + '</span></div><div class="muted mono">' + escapeHtml(JSON.stringify(e.detail || {})) + '</div></div>').join('') || '<p class="muted">Nothing yet.</p>';

    + '<div class="muted mono" style="font-size:11px">' + escapeHtml(d.user_id || 'no Margyn login linked') + '</div></div>'
    + '<div class="tabpane"><h3>Funnel</h3><div class="kv">' + kv + '</div>'
    + '<h3>Link to a Margyn login</h3><div class="invform"><input id="dUid" placeholder="login id (uuid)" value="' + escapeHtml(d.user_id || '') + '"><button class="savebtn" style="margin:0" id="dSave">Save</button><span class="muted" id="dMsg"></span></div>'

/* ---------- Team logins: invited people, analysed (api/ops.js?action=people, api/_lib/opsTeam.js) ----------
   Names and emails of team members (like partner emails above); never message text or figures; phones as
   the last four digits only. */
let team = null, teamSort = 'health', teamDir = 1, teamFilter = 'all';
const HRANK = { red:0, yellow:1, green:2, grey:3 };
const STATUS_LABEL = { member:'Member', invited:'Invited', expired:'Invite expired', cancelled:'Cancelled', removed:'Removed', suspended:'Suspended' };
const PAGE_LABEL = { home:'Home', cash:'Cash', receivables:'Receivables', payables:'Payables', customers:'Customers', vendors:'Vendors', gst:'GST and tax', books:'Books', margin:'Margin', analytics:'Reports', cashflow:'Cash flow', cfopack:'CFO pack', scores:'Pulse score', history:'Conversations', inbox:'Inbox', agents:'Automations', settings:'Settings', people:'People', connectors:'Organisations and sources', invoicing:'Invoicing', payments:'Payments', audit:'Audit', channels:'Channel health', profile:'Profile', financing:'Capital readiness' };
const pageName = (k) => PAGE_LABEL[k] || k;
const ZOHO_STATE = { active:'connected', needs_reauth:'connected, needs signing in again', pending_org_selection:'started connecting, didn’t finish', disconnected:'disconnected' };
const hrs = (h) => h == null ? '—' : h < 1 ? Math.round(h * 60) + ' min' : h < 48 ? (Math.round(h * 10) / 10) + ' h' : Math.round(h / 24 * 10) / 10 + ' d';
const mins = (s) => s < 60 ? s + ' s' : Math.round(s / 60) + ' min';
function kpi(label, value, sub, bad){ return '<div class="kpi' + (bad ? ' bad' : '') + '"><span>' + label + '</span><b>' + value + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; }
function dotsFor(p){
  return '<span class="dots" title="' + escapeHtml(team.stages.map(s => team.stage_labels[s] + ': ' + (p.stages[s] ? fmtDate(p.stages[s]) : (p.stuck_at === s ? 'stuck here' : '—'))).join('\n')) + '">'
    + team.stages.map(s => '<i class="' + (p.stages[s] ? 'on' : p.stuck_at === s ? 'stuck' : '') + '"></i>').join('') + '</span>';
}
function waCell(p){
  const w = p.whatsapp;
  if(!w.linked) return p.member_id ? '<span class="muted">not linked</span>' : '<span class="muted">—</span>';
  const wl = w.welcome;
  const chip = !wl ? '<span class="chip grey">no first message</span>'
    : '<span class="chip ' + (wl.status === 'read' || wl.status === 'delivered' ? 'green' : wl.status === 'failed' ? 'red' : 'yellow') + '">' + (wl.status === 'sent' ? 'sent, unconfirmed' : wl.status) + '</span>';
  const last = (w.messages || [])[0];
  const lastTxt = last ? ' <span class="muted" style="font-size:11px">last: ' + escapeHtml(last.label.toLowerCase()) + ', ' + ago(last.sent_at) + ' ago, ' + escapeHtml(last.status) + '</span>' : '';
  return '<span class="mono">…' + escapeHtml(w.last4) + '</span> ' + chip + lastTxt;
}
function renderTeam(){
  const d = team;
  if(!d){ $('#main').innerHTML = '<div class="loading">Loading team logins…</div>'; return; }
  if(d.error){ $('#main').innerHTML = '<div class="gate">Could not load team logins.</div>'; return; }
  const T = d.totals;
  const banner = (d.missing && d.missing.length ? '<div class="banner">Some sources couldn’t be read, so these parts show as empty, not zero: <b>' + escapeHtml(d.missing.join(', ')) + '</b>.</div>' : '')
    + (!d.pages.length && T.members ? '<div class="banner">Page views and time on each page start after <span class="mono">2026-11-21-ops-page-views.sql</span> is run, and only from then on. Questions, WhatsApp and joins are counted from the start.</div>' : '');
  const kpis = '<div class="kpis">'
    + kpi('Members', T.members, T.open_invites + ' invite' + (T.open_invites === 1 ? '' : 's') + ' open')
    + kpi('Active, 7 days', T.active_7d, T.members ? Math.round(T.active_7d / T.members * 100) + '% of members' : '')
    + kpi('Joined', T.join_rate_pct == null ? '—' : T.join_rate_pct + '%', T.joined + ' of ' + T.invites_sent + ' invited')
    + kpi('Time to join', hrs(T.median_hours_to_join), 'median, invite → joined')
    + kpi('WhatsApp linked', T.whatsapp_linked_pct == null ? '—' : T.whatsapp_linked_pct + '%', T.whatsapp_linked + ' of ' + T.members + ' members')
    + kpi('First message', T.welcome_sent ? T.welcome_delivered + '/' + T.welcome_sent : '—', T.welcome_sent ? T.welcome_read + ' read · ' + T.welcome_failed + ' failed' : 'none sent yet', T.welcome_failed > 0)
    + kpi('Questions, 30 days', T.questions_30d, T.asked_30d + ' people · ' + (T.questions_whatsapp_share_pct == null ? '—' : T.questions_whatsapp_share_pct + '% on WhatsApp'))
    + kpi('Active days', T.avg_active_days_30d == null ? '—' : T.avg_active_days_30d, 'average per member, 30 days')
    + kpi('Needs you', T.needs_attention, T.expiring_48h + ' expiring · ' + T.expired_unused + ' expired', T.needs_attention > 0)
    + '</div>';
  const maxN = Math.max(1, ...d.funnel.map(f => f.count));
  const funnel = '<div class="sec">Journey, everyone invited</div><div class="fun">' + d.funnel.map(f =>
    '<div class="row"><div>' + escapeHtml(f.label) + '</div><div class="bar"><i style="width:' + Math.round(f.count / maxN * 100) + '%"></i></div>'
    + '<div class="num">' + f.count + (f.from_previous_pct != null ? ' <span class="muted">' + f.from_previous_pct + '%</span>' : '') + '</div>'
    + '<div class="muted">' + (f.median_hours_from_previous != null ? 'median ' + hrs(f.median_hours_from_previous) + ' from the step before' : '') + '</div></div>').join('') + '</div>';
  let ps = d.people.slice();
  if(teamFilter === 'attention') ps = ps.filter(p => p.health === 'red' || p.health === 'yellow');
  else if(teamFilter === 'members') ps = ps.filter(p => p.status === 'member' || p.status === 'suspended');
  else if(teamFilter === 'invites') ps = ps.filter(p => ['invited', 'expired', 'cancelled'].includes(p.status));
  const sk = { health: p => HRANK[p.health], person: p => (p.name || p.email || '').toLowerCase(), business: p => (p.business || '').toLowerCase(),
    used: p => -(Date.parse(p.activity.last_used_at || 0) || 0), days: p => -p.activity.active_days_30d, q: p => -(p.activity.questions_app_30d + p.activity.whatsapp_in_30d) };
  ps.sort((a, b) => { const x = sk[teamSort](a), y = sk[teamSort](b); return (x < y ? -1 : x > y ? 1 : 0) * teamDir; });
  const filt = '<div class="wlog"><h2 style="margin:22px 0 8px">People ' + ['all', 'attention', 'members', 'invites'].map(k =>
    '<button data-tf="' + k + '" class="' + (teamFilter === k ? 'on' : '') + '">' + { all:'All', attention:'Needs you', members:'Members', invites:'Invites' }[k] + '</button>').join('') + '</h2></div>';
  const rows = ps.map(p => '<tr data-pk="' + escapeHtml(p.key) + '">'
    + '<td><span class="chip ' + p.health + '">' + (p.health === 'grey' ? 'done' : p.health) + '</span></td>'
    + '<td>' + escapeHtml(p.name || p.email) + (p.name ? '<br><span class="muted">' + escapeHtml(p.email || '') + '</span>' : '') + '</td>'
    + '<td>' + escapeHtml(p.business || '—') + '<br><span class="muted">' + escapeHtml(p.role_label || '') + '</span></td>'
    + '<td>' + escapeHtml(STATUS_LABEL[p.status] || p.status) + '<br>' + dotsFor(p) + '</td>'
    + '<td class="num">' + ago(p.activity.last_used_at) + '</td>'
    + '<td class="num">' + p.activity.active_days_30d + '</td>'
    + '<td class="num">' + p.activity.questions_app_30d + ' / ' + p.activity.whatsapp_in_30d + '</td>'
    + '<td>' + waCell(p) + '</td>'
    + '<td>' + escapeHtml(p.next) + '</td></tr>').join('');
  const table = '<table><thead><tr><th data-ts="health">Health</th><th data-ts="person">Person</th><th data-ts="business">Business · role</th><th>Status · journey</th>'
    + '<th data-ts="used">Last used</th><th data-ts="days">Days 30d</th><th data-ts="q">Asked 30d<br><span style="text-transform:none">app / WhatsApp</span></th><th>WhatsApp</th><th>Next</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="9" class="muted">No one here yet. Invite someone from a business’s Settings > People > App logins.</td></tr>') + '</tbody></table>';
  const biz = '<table><thead><tr><th>Business</th><th>Members</th><th>Active 7d</th><th>WhatsApp</th><th>Invites open</th><th>Books</th></tr></thead><tbody>'
    + d.businesses.map(b => '<tr><td>' + escapeHtml(b.business || b.account_id) + '<br><span class="muted">' + escapeHtml(b.owner_email || '') + '</span></td>'
      + '<td>' + b.members + ' <span class="muted">' + escapeHtml(Object.entries(b.roles).map(([k, v]) => v + ' ' + k).join(', ')) + '</span></td>'
      + '<td class="num">' + b.active_7d + '</td><td class="num">' + b.whatsapp_linked + '</td><td class="num">' + b.open_invites + '</td>'
      + '<td>' + (b.books ? (b.books.length ? b.books.map(x => '<span class="conn">' + escapeHtml(x) + '</span>').join('') : '<span class="muted">none</span>') : '<span class="muted">—</span>') + '</td></tr>').join('')
    + '</tbody></table>';
  const pages = d.pages.length ? '<table><thead><tr><th>Page</th><th>People</th><th>Views</th><th>Time</th></tr></thead><tbody>'
    + d.pages.slice(0, 15).map(x => '<tr><td>' + escapeHtml(pageName(x.page)) + '</td><td class="num">' + x.people + '</td><td class="num">' + x.views + '</td><td class="num">' + mins(x.secs) + '</td></tr>').join('') + '</tbody></table>'
    : '<p class="muted">No page views stored yet.</p>';
  $('#main').innerHTML = banner + kpis + funnel + filt + table
    + '<div class="two"><div><div class="sec">Businesses with team logins</div>' + biz + '</div><div><div class="sec">What team members look at, 30 days</div>' + pages + '</div></div>';
  $('#main').querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { teamFilter = b.dataset.tf; renderTeam(); });
  $('#main').querySelectorAll('th[data-ts]').forEach(th => th.onclick = () => { const k = th.dataset.ts; if(teamSort === k) teamDir *= -1; else { teamSort = k; teamDir = 1; } renderTeam(); });
  $('#main').querySelectorAll('tr[data-pk]').forEach(tr => tr.onclick = () => openPerson(tr.dataset.pk));
}
function openPerson(key){
  const p = team.people.find(x => x.key === key); if(!p) return;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.onclick = (e) => { if(e.target === ov) ov.remove(); };
  const a = p.activity, w = p.whatsapp;
  let prevT = null;
  const journey = team.stages.map(s => {
    const at = p.stages[s], since = at && prevT ? hrs((Date.parse(at) - prevT) / 3600000) : null;
    if(at) prevT = Date.parse(at);
    const ic = at ? '<span class="ic on">&#10003;</span>' : p.stuck_at === s ? '<span class="ic stuck">&#9679;</span>' : '<span class="ic off">&#9675;</span>';
    return '<div class="stg">' + ic + '<div>' + escapeHtml(team.stage_labels[s]) + (p.stuck_at === s ? ' <b style="color:var(--orange)">stuck here</b>' : '') + '</div><div>' + (at ? fmtDate(at) : '—') + '</div><div class="muted">' + (since ? '+' + since : '') + '</div></div>';
  }).join('');
  const maxS = Math.max(1, ...a.strip.map(x => x.n));
  const strip = '<div class="strip">' + a.strip.map(x => '<i class="' + (x.n ? 'on' : '') + '" style="height:' + (x.n ? Math.max(12, Math.round(x.n / maxS * 100)) : 7) + '%" title="' + x.day + ': ' + x.n + '"></i>').join('') + '</div>';
  const pages = p.pages.length ? p.pages.map(x => '<div class="evrow"><div>' + escapeHtml(pageName(x.page)) + '</div><div class="num">' + x.views + ' view' + (x.views === 1 ? '' : 's') + ' · ' + mins(x.secs) + '</div><div class="muted">last ' + fmtDate(x.last_at) + '</div></div>').join('')
    : '<p class="muted">No page views stored' + (a.tracked_since ? '' : ' yet (they start after the page-views SQL, for visits from then on)') + '.</p>';
  const own = p.own_account;
  const ownHtml = own ? '<div class="kv"><div>Their business</div><div>' + escapeHtml(own.company || '—') + '</div>'
      + '<div>Books connected there</div><div>' + (own.books ? (own.books.length ? escapeHtml(own.books.join(', ')) : 'none') : '—') + '</div>'
      + '<div>WhatsApp number on their sign-up</div><div>' + (own.whatsapp_on_file ? 'yes' : 'no') + '</div>'
      + '<div>Zoho</div><div>' + escapeHtml(own.zoho ? own.zoho.split(', ').map(z => ZOHO_STATE[z] || z).join(', ') : 'never tried') + '</div></div>'
      + (own.zoho_failures.length ? '<h3>Zoho connect attempts that failed</h3>' + own.zoho_failures.map(f => '<div class="evrow"><div>' + fmtDate(f.at) + '</div><div class="mono">' + escapeHtml(f.code) + '</div><div class="muted">' + escapeHtml(f.code === 'no_books_organization' ? 'The Zoho login they approved has no Zoho Books company' : '') + '</div></div>').join('') : '')
    : '<p class="muted">No business of their own on Margyn' + (p.user_id ? '' : ' (not joined yet)') + '.</p>';
  ov.innerHTML = '<div class="drawer"><div class="dhead"><button class="x">&times;</button><h2>' + escapeHtml(p.name || p.email) + '</h2>'
    + '<div class="muted" style="font-size:12px">' + escapeHtml([p.email, p.role_label, p.business].filter(Boolean).join(' · ')) + '</div></div>'
    + '<div class="tabs"><button data-t="j" class="active">Journey</button><button data-t="a">Activity</button><button data-t="w">WhatsApp</button><button data-t="o">Their own account</button></div>'
    + '<div class="tabpane" data-p="j"><div class="suggest"><b>Next:</b> ' + escapeHtml(p.next) + '</div>' + journey
      + '<div class="kv" style="margin-top:16px"><div>Invited by</div><div>' + escapeHtml(p.invited_by || '—') + '</div>'
      + '<div>Time to join</div><div>' + hrs(p.hours_to_join) + '</div>'
      + (p.expires_at ? '<div>Invite works until</div><div>' + fmtDate(p.expires_at) + '</div>' : '')
      + '<div>Status</div><div>' + escapeHtml(STATUS_LABEL[p.status] || p.status) + '</div>'
      + '<div>Business books</div><div>' + (p.business_books ? escapeHtml(p.business_books.join(', ') || 'none') : '—') + '</div></div></div>'
    + '<div class="tabpane" data-p="a" hidden><h3>Last 30 days</h3>' + strip
      + '<div class="kv"><div>Last used</div><div>' + fmtDate(a.last_used_at) + '</div>'
      + '<div>Active days, 30d</div><div class="num">' + a.active_days_30d + '</div>'
      + '<div>App opens, 7d / 30d</div><div class="num">' + a.app_opens_7d + ' / ' + a.app_opens_30d + '</div>'
      + '<div>Time in the app, 30d</div><div class="num">' + a.minutes_in_app_30d + ' min</div>'
      + '<div>Questions in the app</div><div class="num">' + a.questions_app_30d + ' in 30d · ' + a.questions_app_total + ' ever</div>'
      + '<div>Messages on WhatsApp</div><div class="num">' + a.whatsapp_in_30d + ' in 30d · ' + a.whatsapp_in_total + ' ever</div></div>'
      + '<h3>Pages, by time spent</h3>' + pages + '</div>'
    + '<div class="tabpane" data-p="w" hidden><div class="kv"><div>Number</div><div>' + (w.linked ? '<span class="mono">…' + escapeHtml(w.last4) + '</span>' : 'not linked') + '</div>'
      + '<div>Linked</div><div>' + (w.linked_at ? fmtDate(w.linked_at) + (w.linked_by ? ' by ' + escapeHtml(w.linked_by) : '') : '—') + '</div>'
      + '<div>Margyn’s first message</div><div>' + (w.welcome ? escapeHtml(w.welcome.status) + (w.welcome.error_code ? ' <span class="mono">' + escapeHtml(w.welcome.error_code) + '</span>' : '') : '—') + '</div>'
      + (w.welcome ? '<div>Sent / delivered / read</div><div>' + fmtDate(w.welcome.sent_at) + ' / ' + fmtDate(w.welcome.delivered_at) + ' / ' + fmtDate(w.welcome.read_at) + '</div>' : '')
      + '<div>Replied after it</div><div>' + (a.replied_after_welcome ? 'yes' : w.welcome ? 'not yet' : '—') + '</div>'
      + '<div>Margyn’s messages to them, 30d</div><div class="num">' + (w.sent_30d != null ? w.sent_30d : a.whatsapp_out_30d) + '</div>'
      + '<div>Last one WhatsApp delivered</div><div>' + fmtDate(w.last_delivered_at) + '</div></div>'
      + '<h3>Every message Margyn sent them</h3>' + ((w.messages || []).length ? w.messages.map(m => '<div class="evrow"><div>' + escapeHtml(m.label) + '</div><div><span class="chip ' + (m.status === 'read' || m.status === 'delivered' ? 'green' : m.status === 'failed' ? 'red' : 'yellow') + '">' + escapeHtml(m.status === 'sent' ? 'sent, unconfirmed' : m.status) + '</span>' + (m.error_code ? ' <span class="mono">' + escapeHtml(m.error_code) + '</span>' : '') + '</div><div class="muted">sent ' + fmtDate(m.sent_at) + (m.delivered_at ? ' · delivered ' + fmtDate(m.delivered_at) : '') + (m.read_at ? ' · read ' + fmtDate(m.read_at) : '') + '</div></div>').join('') : '<p class="muted">None yet.</p>')
      + (w.linked && w.stakeholder_id ? '<h3 style="margin-top:18px">Send them an update</h3><div id="noteBox"><p class="muted" style="font-size:12px;margin:0 0 6px">Fills WhatsApp’s approved update message with lines you choose, pre-filled from this business’s books right now. You see exactly what goes before anything is sent. If they reply, Margyn sends the full update.</p><button class="savebtn" id="noteStart">Write an update</button></div>' : '')
      + '<p class="muted" style="font-size:12px">Times and WhatsApp’s receipts only. Message text never comes here.</p></div>'
    + '<div class="tabpane" data-p="o" hidden>' + ownHtml + '</div></div>';
  document.body.appendChild(ov);
  $('.x', ov).onclick = () => ov.remove();
  ov.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    ov.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    ov.querySelectorAll('.tabpane').forEach(x => x.hidden = x.dataset.p !== b.dataset.t);
  });
  const ns = $('#noteStart', ov);
  if(ns) ns.onclick = () => noteForm(ov, p);
}
/* Send a team member a hand-written update (api/ops.js member-note-draft / member-note). */
async function opsCall(path, opts){
  const res = await fetch('/api/ops' + path, { ...(opts || {}), headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token } });
  let body = null; try { body = await res.json(); } catch(e){}
  if(!res.ok) throw new Error((body && body.error) || ('Could not do that (' + res.status + ')'));
  return body;
}
async function noteForm(ov, p){
  const box = $('#noteBox', ov), w = p.whatsapp;
  const ids = { account_id: p.account_id, stakeholder_id: w.stakeholder_id };
  box.innerHTML = '<p class="muted">Reading the books…</p>';
  let d;
  try { d = await opsCall('?action=member-note-draft&account_id=' + encodeURIComponent(ids.account_id) + '&stakeholder_id=' + encodeURIComponent(ids.stakeholder_id)); }
  catch(e){ box.innerHTML = '<p class="muted">' + escapeHtml(e.message) + '</p>'; return; }
  const max = [60, 60, 220, 220, 220, 220];
  box.innerHTML = '<div class="noteform">'
    + '<p class="muted" style="font-size:12px;margin:0">To …' + escapeHtml(d.to_end) + '. ' + (d.chat_open ? 'Their chat is open, so it goes as a normal message.' : 'They haven’t messaged in over a day, so WhatsApp only takes the approved update message: “Hi [name], this is your scheduled Margyn account update ([which update]), worked out from the books you connected.” and then your four lines.') + '</p>'
    + d.labels.map((l, i) => '<label>' + escapeHtml(l) + '<span class="count" data-c="' + i + '"></span></label><input data-i="' + i + '" maxlength="' + max[i] + '" value="' + escapeHtml(d.params[i] || '') + '">').join('')
    + '<label style="font-weight:400"><input type="checkbox" id="noteReset" style="width:auto;margin-right:6px">Also make the next scheduled update state the figures instead of comparing with earlier ones (use after the books were refreshed or corrected)</label>'
    + '<div><button class="ghostbtn" id="notePrev">Preview</button> <span class="muted" id="noteMsg"></span></div><div id="noteOut"></div></div>';
  const vals = () => [...box.querySelectorAll('input[data-i]')].map(x => x.value.replace(/\s+/g, ' ').trim());
  const count = () => box.querySelectorAll('input[data-i]').forEach(x => { box.querySelector('[data-c="' + x.dataset.i + '"]').textContent = x.value.length + '/' + max[x.dataset.i]; });
  box.querySelectorAll('input[data-i]').forEach(x => x.oninput = () => { count(); $('#noteOut', box).innerHTML = ''; });
  count();
  const msg = (t) => { $('#noteMsg', box).textContent = t || ''; };
  $('#notePrev', box).onclick = async () => {
    msg('Checking…');
    let r;
    try { r = await opsCall('?action=member-note', { method:'POST', body: JSON.stringify({ ...ids, params: vals(), dry_run: true }) }); }
    catch(e){ msg(e.message); return; }
    msg('');
    $('#noteOut', box).innerHTML = '<div class="notepreview">' + escapeHtml(r.text) + '</div><button class="savebtn" id="noteSend">Send to …' + escapeHtml(r.to_end) + '</button>';
    $('#noteSend', box).onclick = async (ev) => {
      ev.target.disabled = true; ev.target.textContent = 'Sending…';
      let s;
      try { s = await opsCall('?action=member-note', { method:'POST', body: JSON.stringify({ ...ids, params: vals(), reset_comparison: $('#noteReset', box).checked }) }); }
      catch(e){ ev.target.disabled = false; ev.target.textContent = 'Send to …' + r.to_end; msg(e.message); return; }
      box.innerHTML = '<div class="suggest" style="background:#E7F6EE;border-color:rgba(14,143,92,.25);color:var(--emerald)"><b>Sent</b> to …' + escapeHtml(s.to_end) + (s.via === 'template' ? ' as the approved update message' : '') + '. WhatsApp’s delivered / read shows above once it reports.' + (s.comparison_reset ? ' The next scheduled update will state the figures.' : '') + '</div>';
    };
  };
}
async function loadTeam(){
  try { team = await api('?action=people'); }
  catch(e){ if(e.gate) throw e; team = { error: true }; }
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function load(){
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ $('#main').innerHTML = '<div class="gate">Not signed in. Open the app, sign in as the founder, then reload this page.</div>'; return; }
    token = session.access_token;
    if(view === 'team'){
      team = null; renderTeam();
      await loadTeam();
      $('#genAt').textContent = team && team.generated_at ? 'as of ' + fmtDate(team.generated_at) : '';
      renderTeam();
      return;
    }
    if(view === 'investors'){
      investors = null; renderInvestors();
      await loadInvestors();
      $('#genAt').textContent = investors && investors.generated_at ? 'as of ' + fmtDate(investors.generated_at) : '';
      renderInvestors();
      return;
    }
    const [res, met] = await Promise.all([
      api('?action=partners'),
      api('?action=metrics').catch(() => null),
      loadWatchLog()
    ]);
    partners = res.partners || [];
    metricsConfigured = met ? !!met.configured : null;
    metricsById = Object.fromEntries(((met && met.rows) || []).map(r => [r.user_id, r]));
    $('#genAt').textContent = 'as of ' + fmtDate(res.generated_at);
    renderList();
  } catch(e){
    if(e.gate) gateScreen();
    else $('#main').innerHTML = '<div class="gate">Error loading: ' + escapeHtml(e.message) + '</div>';
  }
}

(async function init(){
  if(!window.supabase){ $('#main').innerHTML = '<div class="gate">Could not load auth library.</div>'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  $('#refreshBtn').onclick = load;
  $('#tabPartners').onclick = () => setView('partners');
  $('#tabInvestors').onclick = () => setView('investors');
  $('#tabTeam').onclick = () => setView('team');
  load();
})();
</script>
